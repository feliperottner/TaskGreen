## ==============================
## Configuração do MongoDB Atlas
## ==============================

# URI de conexão com o MongoDB Atlas (serviço de banco de dados na nuvem)
# Formato: mongodb+srv://<usuário>:<senha>@<cluster>.mongodb.net/<banco>?<parâmetros>
# - Usuário: feliperottnerrodrigues
# - Senha: root (NÃO RECOMENDADO em produção)
# - Cluster: taskgreen.wqod5xy
# - Banco de dados: taskgreen-api
# Parâmetros adicionais:
# - retryWrites=true: permite novas tentativas de escrita em caso de falha
# - w=majority: garante que as escritas sejam replicadas na maioria dos nós
# - appName=taskgreen: nome da aplicação para identificação no MongoDB Atlas
spring.data.mongodb.uri=mongodb+srv://feliperottnerrodrigues:root@taskgreen.wqod5xy.mongodb.net/taskgreen-api?retryWrites=true&w=majority&appName=taskgreen

## ==============================
## Configurações de Upload de Arquivos
## ==============================

# Diretório onde os arquivos enviados serão armazenados
# - O caminho "./uploads" indica uma pasta 'uploads' no diretório raiz da aplicação
file.upload-dir=./uploads

# Tamanho máximo permitido para upload de um único arquivo
spring.servlet.multipart.max-file-size=50MB

# Tamanho máximo total permitido para uma requisição multipart (que pode conter vários arquivos)
spring.servlet.multipart.max-request-size=50MB

## ==============================
## Configurações do Servidor
## ==============================

# Porta onde a aplicação Spring Boot irá rodar
server.port=8080

## ==============================
## Configurações do Swagger/OpenAPI
## ==============================

# Caminho personalizado para a interface do Swagger UI
# Padrão seria /swagger-ui.html, aqui foi customizado para /swagger-documents.html
springdoc.swagger-ui.path=/swagger-documents.html

# Caminho para o endpoint que gera a documentação OpenAPI em formato JSON
springdoc.api-docs.path=/api-task-docs

# Ordenação dos endpoints na interface Swagger UI
# 'method' ordena pelos métodos HTTP (GET, POST, PUT, DELETE, etc.)
springdoc.swagger-ui.operationsSorter=method

# Título que será exibido na interface Swagger UI
springdoc.swagger-ui.title=API de Tarefas Pessoais