# Configuração do MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/tarefasdb?retryWrites=true&w=majority


# ==============================
# CONFIGURAÇÃO DE UPLOAD DE IMAGENS
# ==============================
# Tamanho máximo para upload de arquivos
# Configurações de upload local
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==============================
# CONFIGURAÇÃO DO SERVIDOR (OPCIONAL)
# ==============================
# Porta da API (padrão: 8080)
server.port=8080

# Habilita o CORS globalmente (útil para desenvolvimento)
# (Se precisar, configure CORS via classe Java, como veremos na Melhoria 2)
# server.cors.allowed-origins=*

# ==============================
# CONFIGURAÇÃO DO SWAGGER (DOCUMENTAÇÃO)
# ==============================
# URL do Swagger UI (acessível em: http://localhost:8080/swagger-documents.html)
springdoc.swagger-ui.path=/swagger-documents.html

# Caminho para o endpoint da documentação JSON
springdoc.api-docs.path=/api-task-docs

# Ordena os endpoints por método (GET, POST, etc.)
springdoc.swagger-ui.operationsSorter=method

# Título da documentação (opcional)
springdoc.swagger-ui.title=API de Tarefas Pessoais
