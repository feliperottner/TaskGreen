# ==============================
# CONFIGURA��O DO BANCO DE DADOS (MySQL)
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/tarefas?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Atualiza automaticamente as tabelas do banco
spring.jpa.hibernate.ddl-auto=update

# Mostra as consultas SQL no console (�til para desenvolvimento)
spring.jpa.show-sql=true

# ==============================
# CONFIGURA��O DO SWAGGER (DOCUMENTA��O)
# ==============================
# URL do Swagger UI (acess�vel em: http://localhost:8080/swagger-documents.html)
springdoc.swagger-ui.path=/swagger-documents.html

# Caminho para o endpoint da documenta��o JSON
springdoc.api-docs.path=/api-task-docs

# Ordena os endpoints por m�todo (GET, POST, etc.)
springdoc.swagger-ui.operationsSorter=method

# T�tulo da documenta��o (opcional)
springdoc.swagger-ui.title=API de Tarefas Pessoais

# ==============================
# CONFIGURA��O DE UPLOAD DE IMAGENS
